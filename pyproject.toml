[project]
name = "amide-brics-pipeline"
version = "0.1.0"
description = "amide_brics SAFE fragmentation and masked discrete flow matching for antimicrobial peptides."
requires-python = ">=3.12"

dependencies = [
    # --- training ---
    "torch>=2.6",
    "lightning>=2.4",
    "einops>=0.8",
    "huggingface-hub>=0.26",
    "wandb>=0.18",
    "biopython>=1.84",
    "tqdm>=4.66",
    # --- dataset pipeline ---
    "requests>=2.34",
    "numpy>=2.5",
    "pandas>=3.0",
    "rdkit>=2026.3.4",
    "datamol>=0.12.5",
    "safe-mol>=0.1.14",
    "tokenizers>=0.22",
    # safe-mol 0.1.x imports symbols that transformers 5.x removed, so it must be
    # kept on the 4.x line (safe-mol itself declares no upper bound). The training
    # code only uses get_{linear,cosine}_schedule_with_warmup, stable across 4.x.
    "transformers>=4.42,<5",
]

# flash-attn is optional and needs a wheel built for the GPU; without it the model runs on sdpa (--attn_backend sdpa).
[project.optional-dependencies]
flash = ["flash-attn>=2.7"]

# Run from the repo root (python -m training.train ...). Not built or published as a distribution.
[tool.uv]
package = false
no-build-isolation-package = ["flash-attn"]

# torch from the CUDA 13.0 wheel index: it carries kernels for Blackwell GPUs (RTX PRO 6000, sm_120) and needs a
# driver that supports CUDA 13 (the VACC nodes load cuda/13.0.2). For an older GPU or driver, e.g. an RTX 4080 on a
# 560 driver, use cu126 here instead and run `uv lock`.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
